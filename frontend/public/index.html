<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" />
    <meta name="description" content="Discover and book the best study spaces at RPI. Find classrooms with specific features like windows, outlets, and more. Plan your study sessions with Study Compass.">
    
    <meta property="og:title" content="All of campus in one place | Meridian">
    <meta property="og:description" content="Discover and book the best study spaces at RPI. Find classrooms with specific features like windows, outlets, and more. Plan your study sessions with Meridian.">
    <meta property="og:image" content="https://meridian.study/icon.svg">
    <meta property="og:url" content="https://meridian.study">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="All of campus in one place | Meridian">
    <meta name="twitter:description" content="Discover and book the best study spaces at RPI. Find classrooms with specific features like windows, outlets, and more. Plan your study sessions with Study Compass.">
    <meta name="twitter:image" content="https://www.study-compass.com/twitter-banner.jpg">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      (function () {
        var host = String(location.hostname || '').replace(/^www\./, '').toLowerCase();
        var path = location.pathname || '/';
        var onJustGoHost = host === 'justgo.lol' || (host === 'localhost' && (function () {
          try { return localStorage.getItem('justgoHostOverride') === '1'; } catch (e) { return false; }
        })());
        var onLanding = false;
        if (onJustGoHost) {
          onLanding = !/^\/(privacy-policy|terms-of-service|justgo\/creator|creator|qr\/)/.test(path);
        } else {
          onLanding = path === '/justgo' || /^\/justgo\/(?!privacy-policy|terms-of-service|creator|qr\/)[^/]+$/.test(path);
        }
        if (!onLanding) return;
        var base = '%PUBLIC_URL%';
        var mobile = window.matchMedia('(max-width: 899px)').matches;
        var preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = base + (mobile ? '/justgo/hero-court-mobile.webp' : '/justgo/hero-court.webp');
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
        var mark = document.createElement('link');
        mark.rel = 'preload';
        mark.as = 'image';
        mark.href = base + (mobile ? '/justgo/wordmark-1298.png' : '/justgo/wordmark-1624.png');
        mark.fetchPriority = 'high';
        document.head.appendChild(mark);
        var fonts = document.createElement('link');
        fonts.rel = 'preconnect';
        fonts.href = 'https://fonts.googleapis.com';
        document.head.appendChild(fonts);
        var gstatic = document.createElement('link');
        gstatic.rel = 'preconnect';
        gstatic.href = 'https://fonts.gstatic.com';
        gstatic.crossOrigin = 'anonymous';
        document.head.appendChild(gstatic);
      })();
    </script>
    <title>Meridian</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
