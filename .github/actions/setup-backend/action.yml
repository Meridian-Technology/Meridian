name: Setup backend
description: Validate and install the backend with its pinned private dependency.

inputs:
  ssh-private-key:
    description: SSH private key used to fetch private dependencies.
    required: false
  ssh-private-key-base64:
    description: Base64-encoded SSH private key used to fetch private dependencies.
    required: false

runs:
  using: composite
  steps:
    - name: Validate private dependency lockfile
      shell: bash
      run: |
        REF=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('./private-deps.lock','utf8'));console.log(d?.events?.ref||'')")
        if [ -z "$REF" ]; then echo "private-deps.lock missing events.ref"; exit 1; fi
        if ! echo "$REF" | grep -qE '^[a-fA-F0-9]{40}$'; then echo "events.ref must be 40-char hex SHA, got: $REF"; exit 1; fi

    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: backend/package-lock.json

    - name: Install SSH
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y openssh-client git

    - name: Setup SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_PRIVATE_KEY_BASE64: ${{ inputs.ssh-private-key-base64 }}
      run: chmod +x ./bin/setup_ssh && ./bin/setup_ssh

    - name: Fetch private dependencies
      shell: bash
      run: chmod +x ./bin/fetch_private_deps && ./bin/fetch_private_deps

    - name: Install backend dependencies
      shell: bash
      run: npm ci --prefix backend
