name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}

      - uses: ./.github/actions/setup-frontend

      - name: Build frontend
        run: CI=false npm --prefix frontend run build

  backend-tests:
    if: github.event_name == 'pull_request'
    name: Backend / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: discovery-catalog
            label: Discovery and catalog
          - group: compute-admin
            label: Compute and admin
          - group: consumer-experience
            label: Consumer experience
          - group: crews-weekly-drop
            label: Crews and weekly drop
          - group: jobs-notifications
            label: Jobs and notifications
          - group: creator-editorial
            label: Creator and editorial
          - group: platform-core
            label: Platform core

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}

      - name: Validate semantic test assignments
        run: npm --prefix backend run test:groups:validate

      - name: Run ${{ matrix.label }} tests
        run: npm --prefix backend run test:group -- ${{ matrix.group }}

  frontend-tests:
    if: github.event_name == 'pull_request'
    name: Frontend / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: admin-operations
            label: Admin operations
          - group: product-experience
            label: Product experience

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend

      - name: Validate semantic test assignments
        run: npm --prefix frontend run test:groups:validate

      - name: Run ${{ matrix.label }} tests
        run: npm --prefix frontend run test:group -- ${{ matrix.group }}

  backend-coverage:
    if: github.event_name == 'push'
    name: Backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-backend
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}

      - name: Run backend coverage
        run: npm --prefix backend run test:coverage -- --json --outputFile=coverage/test-results.json --coverageReporters=text --coverageReporters=lcov --coverageReporters=clover --coverageReporters=json --coverageReporters=json-summary

      - name: Publish backend summary
        if: always()
        run: node scripts/ci/publish-coverage-summary.js backend

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-and-coverage
          path: |
            backend/coverage/lcov.info
            backend/coverage/coverage-summary.json
            backend/coverage/test-results.json
            backend/coverage/clover.xml
            backend/coverage/coverage-final.json
            backend/coverage/lcov-report/**
          if-no-files-found: warn

  frontend-coverage:
    if: github.event_name == 'push'
    name: Frontend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend

      - name: Run frontend coverage
        run: npm --prefix frontend run test:coverage -- --json --outputFile=coverage/test-results.json --coverageReporters=text --coverageReporters=lcov --coverageReporters=clover --coverageReporters=json --coverageReporters=json-summary

      - name: Publish frontend summary
        if: always()
        run: node scripts/ci/publish-coverage-summary.js frontend

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-test-and-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
            frontend/coverage/test-results.json
            frontend/coverage/clover.xml
            frontend/coverage/coverage-final.json
            frontend/coverage/lcov-report/**
          if-no-files-found: warn
